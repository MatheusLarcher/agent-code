<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self' data: blob:; frame-src 'self' blob:; object-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Agent Code</title>
    <!--
      Abertura em duas etapas: entre a janela pintar e o React montar passam
      segundos (o bundle da interface é grande, e o banco pode estar numa pasta
      sincronizada). Sem isto, esse intervalo é uma janela preta e vazia — que
      se lê como travada, não como abrindo. É CSS e markup puros, dentro do
      próprio HTML, porque qualquer coisa que dependa do bundle chegaria tarde
      demais para o problema que resolve. O React descarta este conteúdo na
      primeira renderização; daí em diante quem indica a espera é o `.app-boot`
      do App, com a mesma aparência, para não haver piscada na troca.
    -->
    <style>
      body {
        margin: 0;
        background: #1f1e1d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #a3a09b;
      }
      #boot .spin {
        width: 22px;
        height: 22px;
        border: 2px solid #3a3836;
        border-top-color: #d97757;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .label {
        font-size: 13px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="spin"></div>
        <div class="label">Abrindo o Agent Code…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

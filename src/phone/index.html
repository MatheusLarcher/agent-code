<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#1f1e1d" />
    <title>Agent Remote</title>
    <style>
      html, body { margin: 0; background: #1f1e1d; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 22px; height: 22px; border: 2px solid #3a3836; border-top-color: #d97757; border-radius: 50%; animation: boot 0.8s linear infinite; }
      @keyframes boot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

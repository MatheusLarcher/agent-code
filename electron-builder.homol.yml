# Variante "Agent Code Homol" — instala AO LADO do Agent Code, sem tocá-lo.
# Uso: npm run package:homol (ver docs/HOMOL.md). O electron-builder.yml
# principal não muda: o build original sai idêntico ao de hoje.
extends: ./electron-builder.yml

appId: com.larchertech.agentcode.homol
productName: Agent Code Homol

# O nome do pacote vira o nome do app (app.getName()): é ele que separa a pasta
# de dados (%APPDATA%\agent-code-homol), a pasta de instalação
# (%LOCALAPPDATA%\Programs\agent-code-homol) e liga a variante em
# src/main/appVariant.ts (portas, pastas locais, extensão do Chrome).
extraMetadata:
  name: agent-code-homol

# Atualização automática pelo fork do usuário. Fica em win/mac (e não no
# `publish` de cima) porque o `extends` CONCATENA listas: o `publish` de cima
# viraria [MatheusLarcher, erickxc] e o app-update.yml pega o primeiro. O
# `publish` da plataforma tem precedência sobre o global no electron-builder.
win:
  publish:
    - provider: github
      owner: erickxc
      repo: agent-code

mac:
  publish:
    - provider: github
      owner: erickxc
      repo: agent-code

dmg:
  artifactName: AgentCode-Homol-mac-${arch}.dmg

nsis:
  artifactName: AgentCode-Homol-setup.exe
  # GUID próprio: as chaves de desinstalação no registro são outras, então
  # instalar/desinstalar a Homol nunca remove o Agent Code.
  guid: aa6188e2-7456-437a-9d55-959cf0252e2b
  shortcutName: Agent Code Homol
  uninstallDisplayName: Agent Code Homol
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh

appId: com.larchertech.agentcode
productName: Agent Code
copyright: Larcher Tech

directories:
  output: dist
  buildResources: build

# asar desligado de propósito: o Agent SDK (claude.exe) e o Playwright
# executam binários de dentro de node_modules — dentro do asar não rodam.
asar: false

files:
  - out/**
  - package.json
  # O main é externalizado pelo electron-vite; mantenha o SDK usado em
  # produção dentro do instalador mesmo quando `files` está customizado.
  - node_modules/@typesafe-ai/sdk/**
  # O motor: o Agent SDK e o Claude Code CLI por plataforma. Tem que viajar
  # dentro do setup — o app nunca usa um `claude` instalado na maquina.
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # Kit de skills empacotado: `app.getAppPath()` no exe é resources/app, e o
  # skillManager sincroniza de <appRoot>/.agents/skills para <cacheDir>/skills.
  - .agents/skills/**
  - '!out/windows-control/**' # vai como extraResources (o helper procura em resources/windows-control)
  - '!out/ms-playwright/**' # idem: vai como extraResources

extraResources:
  # Helper nativo do controle do Windows (resolveHelperPath → resources/windows-control)
  - from: out/windows-control
    to: windows-control
  # Chromium do Playwright embutido (PLAYWRIGHT_BROWSERS_PATH aponta pra cá em produção)
  - from: out/ms-playwright
    to: ms-playwright

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  artifactName: AgentCode-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

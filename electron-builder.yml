appId: com.larchertech.agentcode
productName: Agent Code
copyright: Larcher Tech

directories:
  output: dist
  buildResources: build

# asar desligado de propósito: o Agent SDK (claude.exe) e o Playwright
# executam binários de dentro de node_modules — dentro do asar não rodam.
asar: false

files:
  # Só o que o app carrega de out/. NÃO `out/**` com exclusões: o electron-builder
  # põe as negações antes do `out/**`, que as reinclui — o Chromium, o controle do
  # Windows e o Postgres iam duplicados (resources/ e resources/app/out/).
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # O main é externalizado pelo electron-vite; mantenha o SDK usado em
  # produção dentro do instalador mesmo quando `files` está customizado.
  - node_modules/@typesafe-ai/sdk/**
  # O motor: o Agent SDK e o Claude Code CLI por plataforma. Tem que viajar
  # dentro do setup — o app nunca usa um `claude` instalado na maquina.
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # O MCP "rea" (main/reaMcp.ts): o rea.mjs roda pelo Node do próprio Electron
  # (ELECTRON_RUN_AS_NODE) — viaja no setup, sem npm/Node na maquina do usuário.
  - node_modules/rea-agents/**
  # Kit de skills empacotado: `app.getAppPath()` no exe é resources/app, e o
  # skillManager sincroniza de <appRoot>/.agents/skills para <cacheDir>/skills.
  - .agents/skills/**
  # Kits de skills atrás de um interruptor (main/skillKits.ts): vão em todo
  # instalador e só chegam ao cache com o interruptor do kit ligado.
  - .agents/skills-ecc/**
  # Skills que o usuário instalou no cache da máquina de build
  # (scripts/stage-skills.mjs). Semeiam o cache de instalações novas.
  - from: .seed-skills
    to: .agents/seed-skills
  # Voz local: NENHUM peso de modelo vai no instalador. Kokoro e Whisper
  # (turbo ~1-1,6 GB, small ~0,9 GB) são baixados no primeiro uso para a pasta
  # de cache local da máquina (ver ensureVoiceCacheDir em voiceService.ts). Estas
  # exclusões são a trava caso um .onnx apareça em out/ ou em node_modules.
  - '!**/*.onnx'
  - '!**/*.onnx_data'

extraResources:
  # Helper nativo do controle do Windows (resolveHelperPath → resources/windows-control)
  - from: out/windows-control
    to: windows-control
  # Chromium do Playwright embutido (PLAYWRIGHT_BROWSERS_PATH aponta pra cá em produção)
  - from: out/ms-playwright
    to: ms-playwright
  # PostgreSQL 18.6 embutido, gerenciado pelo app (persistence/localPostgres.ts → resources/postgres)
  - from: out/postgres
    to: postgres
  # 7-Zip do electron-builder (scripts/stage-7zip.mjs): extrai a versão nova em
  # segundo plano para a atualização rápida (main/appUpdate/fastSwap.ts).
  - from: out/7zip
    to: 7zip
  # Extensão local do Chrome (chromeBridge/runtime.ts → resources/chrome-extension).
  # config.js é gerado por instalação (token), nunca empacotado.
  - from: src/chromeExtension
    to: chrome-extension
    filter:
      - '**/*'
      - '!config.js'
  # Modelos 3D dos agentes do Escritório e o ambiente do PBR assado (main/officeAgents.ts → resources/office-agents).
  - from: resources/office-agents
    to: office-agents
    filter:
      - '*.glb'
      - '*.bin'

# Feed de atualização: o README baixa de releases/latest/download/AgentCode-setup.exe
# e o electron-updater lê o app-update.yml que o electron-builder gera a partir
# daqui (owner/repo/provider). Quem publica a Release é scripts/publish-release.mjs
# (rascunho + conferência dos anexos antes de tornar pública) — por isso o
# `package:win` roda com `--publish never`.
publish:
  - provider: github
    owner: MatheusLarcher
    repo: agent-code

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  artifactName: AgentCode-setup.exe
  # Um clique e por usuário (%LOCALAPPDATA%\Programs\Agent Code, sem UAC): é o que
  # deixa o app instalar a versão nova sozinho (`--updated /S --force-run`) e faz o
  # latest.yml sair sem isAdminRightsRequired. Sem escolha de pasta: o updater
  # reinstala sempre na mesma.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # customInit: na instalação manual, remove a instalação antiga por máquina
  # (Program Files, HKLM) com um UAC só — ver build/installer.nsh.
  include: build/installer.nsh
